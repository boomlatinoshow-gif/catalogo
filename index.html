<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.B. HOUSE | Perfumería Exclusiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#F3E5AB', dark: '#AA820A' },    
                        darkBg: '#0F0F0F',
                        cardBg: '#1A1A1A'
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-darkBg/90 backdrop-blur-md border-b border-gold/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-gold-dark via-gold to-gold-light flex items-center justify-center text-darkBg font-serif font-bold text-xl shadow-lg shadow-gold/20">
                    JB
                </div>
                <div>
                    <h1 class="font-serif text-xl sm:text-2xl tracking-wider text-gold font-bold">J.B. HOUSE</h1>
                    <p class="text-xs text-gray-400 tracking-widest uppercase">PERFUMERÍA ÁRABE ORIGINAL</p>
                </div>
            </div>

            <!-- CART BUTTON -->
            <button onclick="toggleCart()" class="relative bg-cardBg border border-gold/40 hover:border-gold px-4 py-2.5 rounded-full flex items-center space-x-2 transition-all duration-300 group">
                <i class="fa-solid fa-bag-shopping text-gold text-lg group-hover:scale-110 transition-transform"></i>
                <span class="text-sm font-medium hidden sm:inline">Pedido</span>
                <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-gold text-darkBg text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md">0</span>
            </button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="relative py-12 sm:py-20 px-4 text-center bg-gradient-to-b from-cardBg to-darkBg border-b border-white/5">
        <div class="max-w-3xl mx-auto space-y-4">
            <span class="text-gold text-xs sm:text-sm uppercase tracking-[0.3em] font-semibold bg-gold/10 px-4 py-1.5 rounded-full border border-gold/30 inline-block">
               La psicología de la atracción hecha aroma.
            </span>
            <h2 class="font-serif text-3xl sm:text-5xl font-bold tracking-wide text-white">
                Descubre Tu Esencia Única
            </h2>
            <p class="text-gray-400 text-sm sm:text-base max-w-xl mx-auto">
                Explora nuestra colección de perfumes 100% originales. Envios seguros a todo el Ecuador, completamente Gratis.
            </p>
        </div>
    </section>

    <!-- MAIN CONTENT & FILTERS -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- SEARCH & CATEGORIES -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-10">
            <!-- Search bar -->
            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar perfume o inspiración..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-cardBg border border-white/10 rounded-xl focus:outline-none focus:border-gold text-sm text-white placeholder-gray-500 transition-colors">
            </div>

            <!-- Filter tabs -->
            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-center">
                <button onclick="setCategory('all')" id="cat-all" class="cat-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all bg-gold text-darkBg font-semibold shadow-md">Todos</button>
            </div>
        </div>

        <!-- PRODUCTS GRID -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Se llena con JavaScript -->
        </div>
    </main>

    <!-- CART DRAWER MODAL -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex justify-end transition-opacity">
        <div class="bg-cardBg w-full max-w-md h-full flex flex-col border-l border-gold/20 shadow-2xl transform transition-transform">
            <!-- Cart Header -->
            <div class="p-5 border-b border-white/10 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bag-shopping text-gold"></i>
                    <h3 class="font-serif font-bold text-lg text-white">Tu Pedido</h3>
                </div>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Cart Items -->
            <div id="cart-items" class="flex-grow overflow-y-auto p-5 space-y-4 divide-y divide-white/5">
                <!-- Items dinámicos -->
            </div>

            <!-- Cart Footer -->
            <div class="p-5 border-t border-white/10 bg-darkBg/50 space-y-
